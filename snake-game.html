<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Snake Game</title>
    <link rel="stylesheet" href="css/snake-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            overscroll-behavior: contain;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .game-container {
            touch-action: none;
            max-height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Snake Game</h1>
            <div class="score-container">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="high-score">High Score: <span id="highScore">0</span></div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-controls">
            <div class="control-message">Use arrow keys or swipe to control the snake</div>
            <div class="mobile-controls">
                <button id="upBtn" aria-label="Move Up">↑</button>
                <div class="horizontal-controls">
                    <button id="leftBtn" aria-label="Move Left">←</button>
                    <button id="rightBtn" aria-label="Move Right">→</button>
                </div>
                <button id="downBtn" aria-label="Move Down">↓</button>
            </div>
        </div>
        
        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <p>Your score: <span id="finalScore">0</span></p>
                <button id="restartBtn">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="js/snake-script.js"></script>
</body>
</html>
