<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oktay's Links</title>
    <meta
      name="description"
      content="All my links."
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: "Space Grotesk", "Inter", "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #f0f0f0;
        color: #ffffff;
      }

      .phone-frame {
        width: min(100%, 500px);
        min-height: 96vh;
        border-radius: 52px;
        overflow: hidden;
        position: relative;
        padding: 88px 34px 56px;
        background-image: linear-gradient(
            rgba(31, 103, 105, 0.2),
            rgba(31, 103, 105, 0.2)
          ),
          url("https://images.unsplash.com/photo-1669757457244-476571df8458?auto=format&fit=crop&w=900&q=80");
        background-size: cover;
        background-position: center;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(37, 106, 111, 0.45) 0%,
          rgba(64, 140, 142, 0.08) 30%,
          rgba(137, 138, 126, 0.35) 100%
        );
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .profile {
        text-align: center;
        margin-bottom: 30px;
      }

      .avatar {
        width: 118px;
        height: 118px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .bio {
        margin: 10px auto 0;
        max-width: 380px;
        color: rgba(255, 255, 255, 0.88);
        font-size: clamp(1rem, 2.1vw, 1.12rem);
        line-height: 1.45;
        font-weight: 500;
      }

      .links {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 20px;
      }

      .links a {
        text-decoration: none;
        color: #14161a;
        background: #ffffff;
        border-radius: 999px;
        min-height: 74px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.5rem, 3.1vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .links a:hover,
      .links a:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.26);
        outline: none;
      }

      .left {
        display: inline-flex;
        align-items: center;
        gap: 20px;
      }

      .emoji {
        font-size: 1.65rem;
        line-height: 1;
      }

      .social {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 22px;
      }

      .social a {
        position: relative;
        width: 54px;
        height: 54px;
        border-radius: 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-decoration: none;
        color: rgba(255, 255, 255, 0.95);

        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border: 1px solid rgba(255, 255, 255, 0.18);

        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);

        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
      }

      .social i {
        font-size: 1.4rem;
        transition: transform 180ms ease;
      }

      /* Hover */
      .social a:hover {
        transform: translateY(-4px) scale(1.08);
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.35),
          0 0 18px rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.2);
      }

      .social a:hover i {
        transform: scale(1.15);
      }

      /* Click press effect */
      .social a:active {
        transform: translateY(-1px) scale(0.96);
      }

      @media (max-width: 560px) {
        .phone-frame {
          border-radius: 40px;
          padding: 66px 24px 44px;
        }

        .links a {
          min-height: 64px;
          font-size: 1.25rem;
          padding: 0 22px;
        }

        .emoji {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone-frame" aria-label="Travel link card">
      <div class="overlay" aria-hidden="true"></div>
      <div class="content">
        <section class="profile">
          <img
            class="avatar"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=220&q=80"
            alt="Katy Delma"
          />
          <h1>Oktay Evin</h1>
          <p class="bio">
            A Management Information Systems student and Developer based in Istanbul
          </p>
        </section>

        <ul class="links" aria-label="Travel links">
          <li>
            <a href="#" aria-label="Travel Bog">
              <span class="left"><span class="emoji">🗺️</span>Travel Bog</span>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Travel Tips">
              <span class="left"><span class="emoji">📚</span>Travel Tips</span>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Hiking Equipment">
              <span class="left"
                ><span class="emoji">⛺</span>Hiking Equipment</span
              >
            </a>
          </li>
          <li>
            <a href="#" aria-label="Camera Equipment">
              <span class="left"
                ><span class="emoji">📷</span>Camera Equipment</span
              >
            </a>
          </li>
        </ul>

        <nav class="social" aria-label="Social media links">
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5Zm8.95 1.5a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.8A3.2 3.2 0 1 0 12 15.2 3.2 3.2 0 0 0 12 8.8Z"
              />
            </svg>
          </a>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7-6.2 7H2.7l7.3-8.4L.8 2h6.5l4.4 6.4L18.9 2Zm-1.1 18h1.8L6.2 3.9H4.3L17.8 20Z"
              />
            </svg>
          </a>
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.04-1.86-3.04-1.86 0-2.14 1.45-2.14 2.95v5.67H9.33V9h3.42v1.56h.05c.48-.9 1.64-1.86 3.38-1.86 3.61 0 4.27 2.37 4.27 5.46v6.29ZM5.31 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.09 20.45H3.53V9h3.56v11.45Z"
              />
            </svg>
          </a>
          <a href="#" aria-label="Pinterest">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a10 10 0 0 0-3.64 19.32 8.4 8.4 0 0 1 .1-2.92l1.15-4.89s-.28-.56-.28-1.38c0-1.29.75-2.26 1.68-2.26.79 0 1.17.6 1.17 1.31 0 .8-.51 2-.78 3.11-.22.94.47 1.7 1.39 1.7 1.67 0 2.95-1.76 2.95-4.3 0-2.25-1.62-3.83-3.93-3.83-2.68 0-4.25 2.01-4.25 4.08 0 .81.31 1.68.7 2.15a.28.28 0 0 1 .06.27l-.28 1.13c-.05.18-.16.22-.37.13-1.38-.64-2.25-2.66-2.25-4.28 0-3.48 2.53-6.68 7.3-6.68 3.83 0 6.8 2.73 6.8 6.39 0 3.82-2.41 6.9-5.76 6.9-1.12 0-2.18-.59-2.54-1.29l-.69 2.62c-.25.96-.93 2.17-1.39 2.91A10 10 0 1 0 12 2Z"
              />
            </svg>
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
