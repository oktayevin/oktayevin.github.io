<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Links</title>
    <meta
      name="description"
      content="Havuz temalı, mobil görünümlü link in bio sayfası."
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f0f0f0;
        color: #ffffff;
      }

      .phone-frame {
        width: min(100%, 500px);
        min-height: 96vh;
        border-radius: 52px;
        overflow: hidden;
        position: relative;
        padding: 88px 34px 56px;
        background-image: linear-gradient(
            rgba(31, 103, 105, 0.2),
            rgba(31, 103, 105, 0.2)
          ),
          url("https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=900&q=80");
        background-size: cover;
        background-position: center;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(37, 106, 111, 0.45) 0%,
          rgba(64, 140, 142, 0.08) 30%,
          rgba(137, 138, 126, 0.35) 100%
        );
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .profile {
        text-align: center;
        margin-bottom: 30px;
      }

      .avatar {
        width: 118px;
        height: 118px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .bio {
        margin: 10px auto 0;
        max-width: 380px;
        color: rgba(255, 255, 255, 0.88);
        font-size: clamp(1rem, 2.1vw, 1.12rem);
        line-height: 1.45;
        font-weight: 500;
      }

      .links {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 20px;
      }

      .links a {
        text-decoration: none;
        color: #14161a;
        background: #ffffff;
        border-radius: 999px;
        min-height: 74px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: clamp(1.5rem, 3.1vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .links a:hover,
      .links a:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.26);
        outline: none;
      }

      .left {
        display: inline-flex;
        align-items: center;
        gap: 20px;
      }

      .emoji {
        font-size: 1.65rem;
        line-height: 1;
      }

      .social {
        margin-top: 34px;
        display: flex;
        justify-content: center;
        gap: 30px;
      }

      .social a {
        color: rgba(255, 255, 255, 0.95);
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1.7rem, 3.5vw, 2.25rem);
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      }

      @media (max-width: 560px) {
        .phone-frame {
          border-radius: 40px;
          padding: 66px 24px 44px;
        }

        .links a {
          min-height: 64px;
          font-size: 1.25rem;
          padding: 0 22px;
        }

        .emoji {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone-frame" aria-label="Travel link card">
      <div class="overlay" aria-hidden="true"></div>
      <div class="content">
        <section class="profile">
          <img
            class="avatar"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=220&q=80"
            alt="Katy Delma"
          />
          <h1>Oktay Evin</h1>
          <p class="bio">
            A Management Information Systems student and Developer based in Istanbul
          </p>
        </section>

        <ul class="links" aria-label="Travel links">
          <li>
            <a href="#" aria-label="Travel Bog">
              <span class="left"><span class="emoji">🗺️</span>Travel Bog</span>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Travel Tips">
              <span class="left"><span class="emoji">📚</span>Travel Tips</span>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Hiking Equipment">
              <span class="left"
                ><span class="emoji">⛺</span>Hiking Equipment</span
              >
            </a>
          </li>
          <li>
            <a href="#" aria-label="Camera Equipment">
              <span class="left"
                ><span class="emoji">📷</span>Camera Equipment</span
              >
            </a>
          </li>
        </ul>

        <nav class="social" aria-label="Social media links">
          <a href="#" aria-label="TikTok">𝄞</a>
          <a href="#" aria-label="YouTube">▶</a>
          <a href="#" aria-label="X">𝕏</a>
          <a href="#" aria-label="Instagram">◉</a>
        </nav>
      </div>
    </main>
  </body>
</html>
