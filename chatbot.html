<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Oktay Evin</title>
    <link rel="icon" href="https://sites.read.cv/api/favicon/meThUjEtZvhYkGD0OhVklVd1Xyq1.ico">
    <link rel="stylesheet" href="css/chatbot.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="login-container">
                <h2><i class="fas fa-robot"></i> AI Chatbot</h2>
                <p>Erişim için kullanıcı bilgilerinizi girin</p>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Kullanıcı Adı" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Şifre" required>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Giriş Yap
                    </button>
                    <div id="loginError" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Chatbot Interface -->
    <div id="chatbotContainer" class="chatbot-container" style="display: none;">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="header-left">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bot-info">
                    <h3>AI Assistant</h3>
                    <span class="bot-status" id="botStatus">Çevrimiçi</span>
                </div>
            </div>
            <div class="header-right">
                <button id="clearChat" class="header-btn" title="Sohbeti Temizle">
                    <i class="fas fa-trash"></i>
                </button>
                <button id="logoutBtn" class="header-btn" title="Çıkış">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chatMessages" class="chat-messages">
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <p>Merhaba! Ben AI asistanınızım. Size nasıl yardımcı olabilirim?</p>
                    <span class="message-time">Şimdi</span>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." maxlength="1000">
                <button id="sendButton" class="send-button">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-info">
                <span id="charCount">0/1000</span>
                <span class="typing-indicator" id="typingIndicator" style="display: none;">
                    <i class="fas fa-circle"></i>
                    <i class="fas fa-circle"></i>
                    <i class="fas fa-circle"></i>
                    AI yazıyor...
                </span>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <i class="fas fa-cog fa-spin"></i>
            <p>Bağlanıyor...</p>
        </div>
    </div>

    <script src="js/chatbot.js"></script>
</body>
</html>
