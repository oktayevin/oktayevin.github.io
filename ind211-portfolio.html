<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #flipbook {
            margin: 0 auto;
        }

        #flipbook .page {
            background: #fff;
            border: 1px solid #c0c0c0;
            padding: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="flipbook-container">
        <div id="flipbook">
            <!-- Pages will be added here -->
        </div>
    </div>

    <!-- Load scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add some pages
            const flipbook = document.getElementById('flipbook');
            
            // Add front cover
            const cover = document.createElement('div');
            cover.className = 'page';
            cover.innerHTML = '<h1>Front Cover</h1>';
            flipbook.appendChild(cover);
            
            // Add content pages
            for (let i = 1; i <= 6; i++) {
                const page = document.createElement('div');
                page.className = 'page';
                page.innerHTML = `<h2>Page ${i}</h2><p>This is page ${i} content.</p>`;
                flipbook.appendChild(page);
            }
            
            // Add back cover
            const backCover = document.createElement('div');
            backCover.className = 'page';
            backCover.innerHTML = '<h1>Back Cover</h1>';
            flipbook.appendChild(backCover);

            // Initialize turn.js
            $(flipbook).turn({
                width: 800,
                height: 600,
                autoCenter: true,
                display: 'double',
                acceleration: true,
                gradients: true,
                elevation: 50
            });
        });
    </script>
</body>
</html>
