<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oktay Flipbook</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        #flipbook-container {
            margin: 50px auto;
            width: 800px;
            height: 600px;
            position: relative;
        }

        #flipbook .page {
            background: #fff;
            background-size: 100% 100%;
        }

        #flipbook .hard {
            background: #444;
            color: #fff;
            -webkit-box-shadow: inset 0 0 5px #666;
            -moz-box-shadow: inset 0 0 5px #666;
            -o-box-shadow: inset 0 0 5px #666;
            -ms-box-shadow: inset 0 0 5px #666;
            box-shadow: inset 0 0 5px #666;
            font-weight: bold;
        }

        #flipbook .odd {
            background: linear-gradient(to right, #f9f9f9 95%, #dadada 100%);
        }

        #flipbook .even {
            background: linear-gradient(to left, #f9f9f9 95%, #dadada 100%);
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="flipbook-container">
        <div id="flipbook">
            <!-- Pages will be dynamically added here -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

    <script>
        $(document).ready(function() {
            // Create pages
            const flipbook = $('#flipbook');
            
            // Add front cover (hard page)
            flipbook.append('<div class="hard"><div class="page-content">FRONT COVER</div></div>');
            flipbook.append('<div class="hard"><div class="page-content">Inside Cover</div></div>');
            
            // Add content pages
            for (let i = 1; i <= 6; i++) {
                flipbook.append(`
                    <div class="page">
                        <div class="page-content">Page ${i}</div>
                    </div>
                `);
            }
            
            // Add back cover (hard page)
            flipbook.append('<div class="hard"><div class="page-content">Inside Back Cover</div></div>');
            flipbook.append('<div class="hard"><div class="page-content">BACK COVER</div></div>');

            // Initialize turn.js with all necessary options
            flipbook.turn({
                width: 800,
                height: 600,
                autoCenter: true,
                display: 'double',
                acceleration: true,
                gradients: true,
                elevation: 50,
                when: {
                    turning: function(e, page, pageObj) {
                        const book = $(this);
                        if (page >= 2) {
                            book.addClass('fixed');
                        } else {
                            book.removeClass('fixed');
                        }
                    },
                    turned: function(e, page) {
                        console.log('Page turned to: ' + page);
                    }
                }
            });

            // Ensure the book is properly centered
            $(window).resize(function() {
                flipbook.turn('size', 
                    $('#flipbook-container').width(),
                    $('#flipbook-container').height()
                );
            });

            // Add keyboard navigation
            $(document).keydown(function(e) {
                if (e.keyCode === 37) { // left arrow
                    flipbook.turn('previous');
                } else if (e.keyCode === 39) { // right arrow
                    flipbook.turn('next');
                }
            });
        });
    </script>
</body>
</html>
