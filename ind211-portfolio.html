<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Flipbook with Turn.js and pdf.js</title>
  
  <!-- 1. jQuery (required by Turn.js) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- 2. Turn.js -->
  <script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>
  
  <!-- 3. pdf.js (core) and worker) -->
  <!-- Must match versions of pdf.min.js and pdf.worker.min.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js"></script>
  
  <style>
    /* Basic page styling */
    body {
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    
    /* Flipbook container styling */
    .flipbook-viewport {
      width: 90%;
      max-width: 1000px;
      margin: 2em auto;
    }
    
    .container {
      width: 100%;
      position: relative;
      margin: 0 auto;
    }
    
    .flipbook {
      width: 800px;    /* Adjust as desired */
      height: 500px;   /* Adjust as desired */
      margin: 0 auto;
      background: #ccc;
    }
    
    /* Each page (added dynamically) will be sized automatically by Turn.js */
    .flipbook .page {
      background-size: cover;
      background-position: center;
    }
    
    /* Hard covers styling */
    .hard {
      background: #999;
      font-weight: bold;
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Flipbook container -->
  <div class="flipbook-viewport">
    <div class="container">
      <div class="flipbook" id="flipbook">
        <!-- Pages will be appended here by JavaScript -->
      </div>
    </div>
  </div>

  <script>
  /*
   * 1) Load the PDF using pdf.js
   * 2) For each page in the PDF:
   *    - Render to a canvas
   *    - Convert canvas to dataURL
   *    - Create a DIV with that dataURL as its background
   *    - Append to the flipbook
   * 3) Initialize Turn.js
   */

  // The URL of the PDF you want to display:
  const pdfURL = 'assets/IND211_Portfolio.pdf';  
  // If your PDF is named differently, e.g. 'IND211_Portfolio.pdf', use './IND211_Portfolio.pdf'

  // Configure pdf.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';

  async function loadPDFAndCreateFlipbook() {
    try {
      // 1) Load the PDF document
      const pdf = await pdfjsLib.getDocument(pdfURL).promise;
      const totalPages = pdf.numPages;

      // 2) Create a "front cover" page
      const frontCover = document.createElement('div');
      frontCover.classList.add('hard');
      frontCover.innerHTML = 'Front Cover';
      document.getElementById('flipbook').appendChild(frontCover);

      // 3) Render each PDF page -> canvas -> dataURL -> Div
      for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);

        // Scale: bigger -> higher resolution but more memory usage
        const scale = 1.5;
        const viewport = page.getViewport({ scale });
        
        // Create a canvas to render this page
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        // Render PDF page into canvas
        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };
        await page.render(renderContext).promise;

        // Convert canvas to data URL (like an inlined image)
        const dataURL = canvas.toDataURL('image/jpeg', 1.0);

        // Create a DIV for this page
        const pageDiv = document.createElement('div');
        pageDiv.classList.add('page');
        // Set background to the data URL
        pageDiv.style.backgroundImage = `url(${dataURL})`;

        // Set size to match canvas dimension
        pageDiv.style.width = viewport.width + 'px';
        pageDiv.style.height = viewport.height + 'px';

        // Append the page DIV to the flipbook
        document.getElementById('flipbook').appendChild(pageDiv);
      }

      // 4) Create a "back cover" page
      const backCover = document.createElement('div');
      backCover.classList.add('hard');
      backCover.innerHTML = 'Back Cover';
      document.getElementById('flipbook').appendChild(backCover);

      // 5) Initialize Turn.js once all pages are appended
      $('#flipbook').turn({
        width: 800,         // Flipbook width (match .flipbook in CSS)
        height: 500,        // Flipbook height
        autoCenter: true,   // Center the book
        elevation: 50,      // 3D 'lift' while page turning
        gradients: true,    // Show gradients
        display: 'double'   // or 'single' for one-page at a time
      });

    } catch (err) {
      console.error('Error loading or rendering PDF:', err);
      alert('Could not load PDF. Check console for details.');
    }
  }

  // Execute when page loads
  document.addEventListener('DOMContentLoaded', () => {
    loadPDFAndCreateFlipbook();
  });
  </script>
</body>
</html>
